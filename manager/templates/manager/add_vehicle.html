{% extends "base/base.html" %}
{% load static %}

{% block title %}Manager | Add Vehicle{% endblock title %}
{% block page-contents %}
<div class="col-md-12 m-auto">

    <div class="card border-0 shadow">
        <div class="card-body">




            <!-- form for user details -->
            <div class="row">
                <div class="col-12">
                    <div class="card border-0  bg-white">
                        <div class="card-body">
                            <!-- form starts here -->
                            <form action="{% url "manager:newvehicle" company.id company.slug %}" method="post" class="user-form">
                               {% csrf_token %}
                                <div class="row row-gap-2">
                                    <div class="col-sm-4 mb-3">
                                        <label for="plate_number">plate Number <span
                                                class="text-danger">*</span></label>
                                        <input type="text" name="plate_number" id="plate-number"
                                            class="form-control py-3"
                                            placeholder="AWX-423-213">
                                    </div>
                                    <div class="col-sm-4 mb-3">
                                        <label for="terminal-1">Terminal 1 <span
                                                class="text-danger">*</span></label>
                                       
                                            <select name="terminal-1" id="terminal-1"  class="form-select py-3">
                                                {% for terminal in terminals %}
                                                <option value="{{terminal.id}}">{{terminal}}</option>
                                                {% endfor %}
                                            </select>
                                    </div>
                                    <div class="col-sm-4 mb-3">
                                        <label for="termina-2">Terminal 2<span
                                                class="text-danger">*</span></label>
                                       
                                                <select name="terminal-2" id="terminal-2" class="form-select py-3">
                                                    {% for terminal in terminals %}
                                                    <option value="{{terminal.id }}">{{terminal}}</option>
                                                    {% endfor %}
                                                </select>
                                                
                                    </div> 
                                    <div class="col-sm-6 mb-3">
                                        <label for="company">Company <span
                                                class="text-danger">*</span></label>
                                       
                                                <select name="company" id="company" class="form-select py-3" readonly>
                                                   
                                                <option value={{company.pk}}>{{company.name}}</option>
                                               
                                                   
                                                </select>
                                                
                                    </div>

                                    <div class="col-sm-6 mb-3">
                                        <label for="fname">Bus Capacity <span
                                                class="text-danger">*</span></label>
                                        <input type="number" name="capacity" id="bus-capacity"
                                            class="form-control py-3" min="7"
                                            placeholder="">
                                    </div>

                                    <div class="col-12 mb-3">
                                        <label for="fname">Price <span
                                                class="text-danger">*</span></label>
                                        <input type="number" name="price" id="price" min='500'
                                            class="form-control py-3" 
                                            placeholder="20000">
                                    </div>
                                    
                                    <div class="col-sm-4 mb-3">
                                       
                                        <input type="checkbox" name="avaliability" id="bus-avaliability"
                                            class="form-check-input p-2" min="7"
                                            placeholder="">

                                            <label for="fname">Is Bus Avalable <span
                                                class="text-danger">*</span></label>
                                    </div>
                                    
                                   


                                </div>
                                
                                <div class="col-sm-6 mb-1 mt-3">
                                    <input type="submit" value="Add Vehicle"
                                        class="btn colorbtn text-white btn-sm p-3">

                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


  
  <!-- Modal -->
  <div class="modal fade" id="AddnewVehicle" tabindex="-1" aria-labelledby="AddnewVehicleLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="AddnewVehicleLabel">Modal title</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          ...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>

{% endblock page-contents %}
