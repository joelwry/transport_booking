<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Booking Statistics</h1>
    <div>
        <h2>Weekly Bookings</h2>
        <canvas id="weeklyChart"></canvas>
    </div>
    <div>
        <h2>Monthly Bookings</h2>
        <canvas id="monthlyChart"></canvas>
    </div>

    <script>
        // Parse data passed from the Django view
        const weeklyData = JSON.parse('{{ weekly_bookings|safe }}');
        const monthlyData = JSON.parse('{{ monthly_bookings|safe }}');

        // Prepare data for Chart.js
        const prepareChartData = (data) => {
            const labels = [];
            const counts = [];
            data.forEach(item => {
                labels.push(item.status);
                counts.push(item.count);
            });
            return { labels, counts };
        };

        const weeklyChartData = prepareChartData(weeklyData);
        const monthlyChartData = prepareChartData(monthlyData);

        // Render weekly bookings chart
        const ctxWeekly = document.getElementById('weeklyChart').getContext('2d');
        new Chart(ctxWeekly, {
            type: 'bar',
            data: {
                labels: weeklyChartData.labels,
                datasets: [{
                    label: 'Weekly Bookings',
                    data: weeklyChartData.counts,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Render monthly bookings chart
        const ctxMonthly = document.getElementById('monthlyChart').getContext('2d');
        new Chart(ctxMonthly, {
            type: 'bar',
            data: {
                labels: monthlyChartData.labels,
                datasets: [{
                    label: 'Monthly Bookings',
                    data: monthlyChartData.counts,
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
