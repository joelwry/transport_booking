<!-- templates/bookings_analytics.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookings Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Bookings Analytics</h1>
    
    {% if top_company %}
        <h2>Top Company: {{ top_company.vehicle__company__name }} with {{ top_company.count }} bookings</h2>
    {% else %}
        <h2>No bookings available.</h2>
    {% endif %}
    
    <canvas id="polarChart"></canvas>
    
    <script>
        var ctx = document.getElementById('polarChart').getContext('2d');
        var polarChart = new Chart(ctx, {
            type: 'polarArea',
            data: {
                labels: {{ company_names|safe }},
                datasets: [{
                    label: 'Bookings per Company',
                    data: {{ booking_counts|safe }},
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(54, 162, 235, 0.2)',
                        'rgba(255, 206, 86, 0.2)',
                        'rgba(75, 192, 192, 0.2)',
                        'rgba(153, 102, 255, 0.2)',
                        'rgba(255, 159, 64, 0.2)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(153, 102, 255, 1)',
                        'rgba(255, 159, 64, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: {
                            display: false
                        },
                        suggestedMin: 0,
                        suggestedMax: Math.max(...{{ booking_counts|safe }}) + 1
                    }
                }
            }
        });
    </script>
</body>
</html>
